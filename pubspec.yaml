name: memoria
description: "Memoria Phase 00 - visual and interaction feasibility prototype (Android)."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter
  # Real-time 3D: Thermion (Dart/Flutter bindings for Google Filament v1.77.2).
  thermion_flutter: 0.7.0
  thermion_dart: 0.7.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  lucide_icons_flutter: ^4.0.3
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/models/
    - assets/env/
    - assets/images/
  shaders:
    - shaders/nebula.frag
    - shaders/grain.frag
    - shaders/dissolve.frag
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-400.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
