name: Android Phase 00 prototype

# Reproduces the Memoria Phase 00 release APK from a clean checkout, verifies it,
# and smoke-tests it on an x86_64 Android emulator (screenshots, recording,
# frame statistics, integration tests). Nothing is deployed or published.

on:
  push:
    branches: [prototype/phase-00-visual]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'
  APK_NAME: Memoria-Phase00-Android-arm64-release.apk

jobs:
  build:
    name: Validate and build arm64 release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@v4

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          echo "NDK: $NDK_VERSION"

      - name: Pub get
        run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: flutter analyze
        run: flutter analyze

      - name: Host toolchain for native-asset hooks
        # `flutter test` runs package build hooks for the host; Thermion's hook
        # compiles a Linux desktop build that needs libc++ and EGL/DRM headers.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev libdrm-dev libegl1-mesa-dev libgbm-dev libgtk-3-dev liblzma-dev ninja-build

      - name: flutter test (unit + widget)
        run: flutter test test --reporter expanded

      - name: Generate throwaway prototype keystore (not committed)
        run: |
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/prototype.jks" -alias memoria-prototype \
            -keyalg RSA -keysize 2048 -validity 3650 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Memoria Phase 00 Prototype, O=Prototype, C=XX"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/prototype.jks
          storePassword=$PASS
          keyAlias=memoria-prototype
          keyPassword=$PASS
          EOF

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}

      - name: Collect APK + SHA-256
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/$APK_NAME"
          (cd artifacts && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          cat "artifacts/$APK_NAME.sha256"
          ls -l artifacts

      - name: Verify signature, ABIs and manifest
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="artifacts/$APK_NAME"
          {
            echo "# APK verification report"
            echo
            echo "## Size"
            stat -c '%s bytes' "$APK"
            echo
            echo "## SHA-256"
            cat "$APK.sha256"
            echo
            echo "## apksigner verify"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "## Native libraries (ABIs)"
            unzip -l "$APK" | grep -E 'lib/[^/]+/.*\.so' || true
            echo
            echo "## aapt2 badging"
            "$BT/aapt2" dump badging "$APK"
            echo
            echo "## Permissions"
            "$BT/aapt2" dump permissions "$APK"
          } | tee artifacts/apk-verification.txt
          # Hard checks: signed, arm64 present, no other ABIs, minSdk 29.
          "$BT/apksigner" verify "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libflutter.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libthermion_dart.so' || unzip -l "$APK" | grep -q 'lib/arm64-v8a/.*thermion'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then echo "Unexpected ABI" && exit 1; fi
          "$BT/aapt2" dump badging "$APK" | grep -q "minSdkVersion:'29'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Memoria-Phase00-Android-arm64-release.apk
          path: |
            artifacts/Memoria-Phase00-Android-arm64-release.apk
            artifacts/Memoria-Phase00-Android-arm64-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification
          path: artifacts/apk-verification.txt
          retention-days: 30

  emulator:
    name: Emulator smoke test, screenshots and integration tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 release APK for the emulator
        # Same sources as the arm64 deliverable; x86_64 only because GitHub's
        # hosted runners can emulate x86_64 Android with KVM, not arm64.
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64

      - name: Run on emulator (API 34, x86_64, SwiftShader GPU)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tools/ci/emulator_smoke.sh build/app/outputs/flutter-apk/app-release.apk emulator-artifacts

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots-and-logs
          path: emulator-artifacts
          if-no-files-found: warn
          retention-days: 30
