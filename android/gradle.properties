org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The Flutter Gradle plugin otherwise clears defaultConfig.ndk.abiFilters and
# re-adds every Flutter ABI, so plugin JNI libs ship for armeabi-v7a/x86_64 even
# with --target-platform android-arm64. app/build.gradle.kts derives the
# filters from -Ptarget-platform instead.
disable-abi-filtering=true
